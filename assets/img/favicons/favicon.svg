<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Case B: Monoline - 白抜き山＋月、極小視認性重視 -->
  <circle cx="256" cy="256" r="256" fill="#1F8A7A"/>
  <!-- 大きな三日月（背景として） -->
  <path d="M 256 96
           a 160 160 0 1 0 0 320
           a 120 120 0 1 1 0 -240
           a 100 100 0 0 0 0 -80 z"
        fill="#FFFFFF" opacity="0.15"/>
  <!-- 山（メイン、太めシルエット） -->
  <path d="M 80 390
           L 200 220
           L 270 310
           L 340 200
           L 432 390 Z"
        fill="#FFFFFF"/>
  <!-- 月（右上、シャープな三日月） -->
  <path d="M 360 130
           a 55 55 0 1 0 0 110
           a 42 42 0 1 1 0 -110 z"
        fill="#FFFFFF"/>
</svg>
